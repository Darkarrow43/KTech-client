# Configuration file

item_tracking {
    # Send a chat message to the team when a task auto-completes. [default: true]
    B:announce=true

    # Auto-complete a task when its tracked item appears in a team member's inventory. [default: true]
    B:enabled=true
}


reminders {
    # Seconds a player must wait before reminding the same player of the same task again. 0 disables the cooldown. [range: 0 ~ 3600, default: 60]
    I:cooldown=60
}


