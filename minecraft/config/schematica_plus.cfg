# Configuration file

~CONFIG_VERSION: 1

colors {
    # ARGB color (#AARRGGBB).
    S:areaSelectionBoxSideColor=#30FFFFFF

    # ARGB color (#AARRGGBB).
    S:hightlightBlockInInventoryColor=#30FF30FF

    # ARGB color (#AARRGGBB).
    S:materialListHudItemCountsColor=#FFFFAA00

    # ARGB color (#AARRGGBB).
    S:schematicOverlayColorDiffBlock=#30F8D650

    # ARGB color (#AARRGGBB).
    S:schematicOverlayColorExtra=#4CFF4CE6

    # ARGB color (#AARRGGBB).
    S:schematicOverlayColorMissing=#2C33B3E6

    # ARGB color (#AARRGGBB).
    S:schematicOverlayColorWrongBlock=#4CFF3333

    # ARGB color (#AARRGGBB).
    S:schematicOverlayColorWrongState=#4CFF9010

    # ARGB color (#AARRGGBB).
    S:schematicRebuildBreakExceptPlaceOverlayColor=#4CF03030

    # ARGB color (#AARRGGBB).
    S:schematicRebuildBreakPlaceOverlayColor=#4C33CC33

    # ARGB color (#AARRGGBB).
    S:schematicRebuildReplaceOverlayColor=#4CF0A010
}


debug {
    # Display extra information on the debug screen (F3).
    B:showDebugInfo=true
}


general {
    # Extra blocks to consider as air for the schematic renderer.
    S:extraAirBlocks <
     >

    # Schematic directory.
    S:schematicDirectory=schematics

    # Default sort type for the material list.
    S:sortType=

    # Prefer .schemplus when saving. Blocks that require it use this format automatically. Both .schematic and .schemplus files can be loaded.
    B:useSchematicplusFormat=false
}


info_overlays {
    S:blockInfoLinesAlignment=top_right
    B:blockInfoLinesEnabled=true
    D:blockInfoLinesFontScale=0.5
    I:blockInfoLinesOffsetX=4
    I:blockInfoLinesOffsetY=4
    S:blockInfoOverlayAlignment=top_center
    B:blockInfoOverlayEnabled=true
    I:blockInfoOverlayOffsetY=6
    S:defaultSelectionMode=simple
    S:infoHudAlignment=bottom_right
    I:infoHudMaxLines=10
    I:infoHudOffsetX=1
    I:infoHudOffsetY=1
    D:infoHudScale=1.0
    B:infoOverlaysTargetFluids=false
    I:materialListHudMaxLines=10
    D:materialListHudScale=1.0
    B:statusInfoHud=false
    B:statusInfoHudAuto=true
    S:toolHudAlignment=bottom_left
    I:toolHudOffsetX=1
    I:toolHudOffsetY=1
    D:toolHudScale=1.0
    D:verifierErrorHilightAlpha=0.2
    I:verifierErrorHilightMaxPositions=1000
    B:verifierOverlayEnabled=true
    B:warnDisabledRendering=true
}


printer {
    I:breakBlocksPerTick=64
    B:destroyAssist=false

    # Allow the printer to remove nonmatching blocks in survival and creative modes. Survival retains native tool wear and harvest drops; creative does not consume tool durability. Fast breaking requires server support.
    B:destroyBlocks=false

    # Continue through additional creative-mode break targets in the same pass without server assistance. Survival mining time is unchanged; server-assisted breaking uses the configured limits.
    B:destroyInstantly=false
    B:easyPlacePrerequisites=true
    B:highlightNextBlock=false
    I:placeBlocksPerTick=64

    # Delay between placement attempts (in ticks).
    I:placeDelay=1
    B:placeInAir=true
    B:printAutoTool=true
    I:printAutoToolDurability=10
    B:printBreakExtraBlock=false
    B:printBreakWrongBlock=false
    B:printBreakWrongStateBlock=false
    B:printFallingBlockCheck=true
    B:printForcedSneak=false
    B:printHighlight=false
    I:printHighlightFade=5
    B:printHighlightThroughWalls=false
    B:printMissingMaterialHud=true
    S:printSelectionType=render_layers
    S:printSkipList <
     >
    B:printUseTools=true
    B:printerAutoDisable=true
    S:printerBuildOrder=layers
    I:printerIterationTimeLimit=8
    S:printerIteratorMode=xzy
    S:printerIteratorShape=sphere
    B:printerLagCheck=true
    I:printerLagCheckMax=20
    B:printerPauseWhileMoving=false
    B:printerPlacementSolver=true
    I:printerWorkRange=0
    B:printerXAxisReverse=false
    B:printerYAxisReverse=false
    B:printerZAxisReverse=false

    # Timeout before re-trying failed blocks.
    I:timeout=10

    swapslots {
        # Allow the printer to use this hotbar slot.
        B:swapSlot0=false

        # Allow the printer to use this hotbar slot.
        B:swapSlot1=false

        # Allow the printer to use this hotbar slot.
        B:swapSlot2=false

        # Allow the printer to use this hotbar slot.
        B:swapSlot3=false

        # Allow the printer to use this hotbar slot.
        B:swapSlot4=false

        # Allow the printer to use this hotbar slot.
        B:swapSlot5=true

        # Allow the printer to use this hotbar slot.
        B:swapSlot6=true

        # Allow the printer to use this hotbar slot.
        B:swapSlot7=true

        # Allow the printer to use this hotbar slot.
        B:swapSlot8=true
    }

}


render {
    I:adaptiveRenderingMinFps=30

    # Alpha value used when rendering the schematic (1.0 = opaque, 0.5 = half transparent, 0.0 = transparent).
    D:alpha=0.5

    # Enable transparent textures.
    B:alphaEnabled=false

    # Delta value used for highlighting (if you experience z-fighting increase this).
    D:blockDelta=0.005

    # Draw outlines.
    B:drawLines=true

    # Draw surface areas.
    B:drawQuads=true
    B:enableAreaSelectionBoxesRendering=true
    B:enablePlacementBoxesRendering=true
    B:enableRendering=true
    B:enableSchematicBlocksRendering=true
    B:enableSchematicEntityHitboxes=true
    B:enableSchematicFakeLighting=true
    B:enableSchematicFluidRendering=true
    B:enableSchematicOverlayCulling=true
    B:enableSchematicRendering=true

    # Highlight invalid placed blocks and to be placed blocks.
    B:highlight=true

    # Highlight blocks that should be air.
    B:highlightAir=true
    B:ignoreCropAge=false
    B:ignoreExistingFluids=false
    B:ignoreSurvivalStates=false
    B:overlayReducedInnerSides=false
    D:placementBoxSideAlpha=0.2
    B:renderAOModernEnable=false
    B:renderAreaSelectionBoxSides=true
    B:renderCollidingSchematicBlocks=false
    B:renderErrorMarkerConnections=false
    B:renderErrorMarkerSides=true
    I:renderFakeLightingLevel=15
    B:renderPlacementBoxSides=false
    B:renderPlacementEnclosingBox=true
    B:renderPlacementEnclosingBoxSides=false
    B:renderSchematicEntities=true
    B:renderSchematicTileEntities=true
    B:schematicOverlayModelOutline=true
    B:schematicOverlayModelSides=true
    D:schematicOverlayOutlineWidth=1.0
    D:schematicOverlayOutlineWidthThrough=3.0
    B:schematicOverlayRenderThroughBlocks=false
    B:schematicOverlayTypeDiffBlock=true
    B:schematicOverlayTypeMissing=true
    B:schematicOverlayTypeWrongBlock=true
    B:schematicOverlayTypeWrongState=true
    I:schematicRenderDistance=0
}


server {
    # Let Easy Place and the printer set the exact orientation metadata of blocks they place.
    B:accuratePlacementEnabled=true

    # Let players browse, download and upload schematics stored on the server.
    B:cloudEnabled=true

    # The operator level a player needs to delete public files of other players.
    I:cloudManagePermissionLevel=2

    # The largest schematic file a player can upload, in kilobytes.
    I:cloudMaxUploadKilobytes=8192

    # The operator level a player needs to add files or folders to the public folder; 0 allows every player.
    I:cloudPublicPermissionLevel=0

    # The operator level a player needs to upload schematics; 0 allows every player.
    I:cloudUploadPermissionLevel=0

    # Allow players to load schematics.
    B:loadEnabled=true

    # The operator level a player needs for complete data requests; 0 allows every player.
    I:nbtRequestPermissionLevel=0

    # Send the complete block entity and entity data of loaded chunks to clients that save schematics.
    B:nbtRequestsEnabled=true

    # Amount of storage provided per-player for schematics on the server.
    I:playerQuotaKilobytes=8192

    # Allow players to use the printer.
    B:printerEnabled=true
    I:printerMaxBreaksPerTick=64
    I:printerMaxPlacementsPerTick=64

    # Maximum printer distance in blocks. 0 keeps normal reach; extended reach requires Plus on both sides.
    I:printerMaxRange=128

    # Let players with creative mode and command permission paste, fill and delete with full NBT from their client.
    B:remoteEditsEnabled=true

    # Allow players to save schematics.
    B:saveEnabled=true

    # Allow players to save schematics serverside, download schematics and see serverside schematics
    B:serversideSchematicsEnabled=true

    # The operator level a player needs to remove placements shared by other players.
    I:sharedPlacementManagePermissionLevel=2

    # The operator level a player needs to share and modify placements; 0 allows every player.
    I:sharedPlacementPermissionLevel=0

    # Let players share placements with everyone on the server.
    B:sharedPlacementsEnabled=true

    # How many placements one player can share at the same time.
    I:sharedPlacementsPerPlayer=64
}


tool {
    I:actionbarHudTicks=60
    B:areaSelectionsPerWorld=true
    B:changeSelectedCornerOnMove=true
    B:cloneAtOriginalPosition=false
    I:commandLimitPerTick=8
    S:commandNameSetblock=setblock
    S:commandNameSummon=summon
    I:commandTaskInterval=1
    B:containerAutofill=true
    B:containerLabels=true
    B:containerVerifier=true
    B:easyPlaceClickAdjacent=false
    B:easyPlaceFirst=true
    B:easyPlaceHoldEnabled=true
    B:easyPlaceMode=false
    B:easyPlacePostRewrite=false
    S:easyPlaceProtocolVersion=auto
    I:easyPlaceSwapInterval=0
    B:easyPlaceSwingHand=true
    B:easyPlaceVanillaReach=false
    B:enableActionbarMessages=true
    B:enableDifferentBlocks=false
    B:executeRequireHoldingTool=true
    B:generateLowercaseNames=false
    B:highlightBlockInInventory=false
    D:inGameMessageTimeout=5.0
    B:layerModeFollowsPlayer=false
    B:materialListContainerScan=false
    B:materialListIgnoreState=false
    B:materialListRecipeDetails=true
    B:pasteIgnoreBlockEntitiesEntirely=false
    B:pasteIgnoreEntities=false
    B:pasteIgnoreInventories=false
    S:pasteLayerBehavior=all
    S:pasteReplaceBehavior=none
    B:pasteUsingCommandsInSp=false

    # Paste without block placement/removal callbacks or neighbor notifications. Singleplayer only; lighting, client synchronization and normal game ticks remain active.
    B:pasteWithoutUpdates=true
    B:pickBlockAvoidDamageable=true
    B:pickBlockAvoidTools=false
    B:pickBlockEnabled=true
    S:pickBlockableSlots=1,2,3,4,5
    B:placementRestriction=false
    S:placementRestrictionWarn=actionbar
    B:renderMaterialListInGuis=true
    B:reverseOperationModeDirection=false
    B:schematicPreview3D=true
    B:schematicPreview3DReplacesImage=false
    S:schematicVcsDeleteMode=matching_block
    B:sharedPlacementsAutoLoad=true
    B:signTextPaste=true

    # Item to use as the schematic tool. Format: modid:name or modid:name@meta (e.g. minecraft:stick). Hold this item to activate tool functions.
    S:toolItem=minecraft:stick
    B:toolItemEnabled=true
    B:unhideSchematicVCS=false
    B:worldFingerprinting=true
}


